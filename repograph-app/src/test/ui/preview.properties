# Isolated preview settings; spring.config.location replaces application.yml discovery.
server.address=${UI_HOST:127.0.0.1}
server.port=${UI_PORT:18550}
server.tomcat.basedir=${UI_PREVIEW_DIR:repograph-app/build/ui-preview}/tomcat
spring.main.banner-mode=off
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
spring.jmx.enabled=false
