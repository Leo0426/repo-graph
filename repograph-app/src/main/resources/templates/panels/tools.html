<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="panel" id="panel-tools" class="panel"
     :class="{ active: $store.repograph.panel === 'tools' }">
  <div class="panel-header">
    <div class="panel-title" data-i18n="tools.title">项目工具</div>
    <div class="panel-subtitle" data-i18n="tools.subtitle">管理已索引项目，检查框架入口并导出依赖清单。</div>
  </div>
  <div class="panel-body">
    <section class="tools-projects card" aria-labelledby="tools-projects-heading">
      <div class="tools-section-heading">
        <div><h2 id="tools-projects-heading" data-i18n="tools.manage.title">已索引项目</h2>
          <p data-i18n="tools.manage.hint">查看项目索引与最近更新时间，进入概览继续分析。</p></div>
        <div class="tools-heading-actions">
          <button type="button" id="tools-refresh-projects" class="btn btn-ghost" onclick="renderProjectsManage()" data-i18n="btn.refresh">刷新</button>
          <a href="#index" class="btn btn-primary tools-index-link" data-i18n="tools.project.index">索引项目</a>
        </div>
      </div>
      <div class="tools-project-filter">
        <label for="tools-project-search" data-i18n="tools.project.filter">筛选项目</label>
        <input type="search" id="tools-project-search" autocomplete="off" placeholder="按名称、项目 ID 或根路径筛选"
               data-i18n-ph="tools.project.filterPh" oninput="filterManagedProjects()" aria-controls="projects-manage-list">
        <span id="tools-project-count" role="status" aria-live="polite"></span>
      </div>
      <div id="tools-project-status" aria-live="polite"></div>
      <div id="projects-manage-list" aria-busy="false"></div>
    </section>

    <div class="tools-utilities">
      <section class="card tools-utility" aria-labelledby="tools-frameworks-heading">
        <div class="tools-utility-heading"><span class="tools-utility-icon" aria-hidden="true">↳</span>
          <div><h2 id="tools-frameworks-heading" data-i18n="tools.frameworks.title">框架入口点</h2>
            <p data-i18n="tools.frameworks.hint">查看索引中识别的框架入口点及其源码位置。</p></div></div>
        <form onsubmit="event.preventDefault();doFrameworks()">
          <label for="frameworks-project-input" data-i18n="tools.project.label">项目名称或 ID</label>
          <div class="tools-tool-input">
            <input type="text" id="frameworks-project-input" autocomplete="off" list="projects-datalist"
                   placeholder="project-name" data-i18n-ph="ph.projectName" oninput="invalidateToolInput('frameworks')">
            <button type="submit" id="frameworks-submit" class="btn btn-ghost" data-i18n="btn.detect">检测</button>
          </div>
        </form>
        <div id="frameworks-result" aria-live="polite" aria-busy="false"></div>
      </section>

      <section class="card tools-utility" aria-labelledby="tools-sbom-heading">
        <div class="tools-utility-heading"><span class="tools-utility-icon" aria-hidden="true">↓</span>
          <div><h2 id="tools-sbom-heading" data-i18n="tools.sbom.title">软件物料清单 (SBOM)</h2>
            <p data-i18n="tools.sbom.hint">从项目根目录生成 CycloneDX JSON，准备完成后下载。</p></div></div>
        <form onsubmit="event.preventDefault();doSbom()">
          <label for="sbom-project-input" data-i18n="tools.project.label">项目名称或 ID</label>
          <div class="tools-tool-input">
            <input type="text" id="sbom-project-input" autocomplete="off" list="projects-datalist"
                   placeholder="project-name" data-i18n-ph="ph.projectName" oninput="invalidateToolInput('sbom')">
            <button type="submit" id="sbom-submit" class="btn btn-ghost" data-i18n="tools.sbom.generate">准备清单</button>
          </div>
        </form>
        <div id="sbom-result" aria-live="polite" aria-busy="false"></div>
      </section>
    </div>
  </div>
</div>
</body>
</html>
