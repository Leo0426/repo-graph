<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="panel" id="panel-graph" class="panel"
     :class="{ active: $store.repograph.panel === 'graph' }">

  <div class="graph-container">
    <!-- Sidebar -->
    <div class="graph-sidebar">
      <div class="task-dependency-notice" data-task-notice="graph" hidden><span></span><button type="button" class="btn btn-ghost"></button></div>
      <div id="graph-target-wrap">
        <label class="field-label" for="graph-target" data-i18n="graph.target">目标符号</label>
        <input type="text" id="graph-target" placeholder="com.example.Foo#bar(String)" autocomplete="off"
          list="graph-symbols-datalist"
          oninput="updateGraphClassHint(this.value);debouncedGraphSymbols()">
        <div id="graph-class-hint" class="graph-class-hint" style="display:none"
          data-i18n="graph.classHint">↳ 类级别查询 — 自动展开到所有成员方法</div>
        <label class="field-label" for="graph-project" data-i18n="graph.entrypointsProject">项目（可选）</label>
        <input type="text" id="graph-project" placeholder="project-name" autocomplete="off"
          list="projects-datalist" data-i18n-ph="ph.projectName">
      </div>

      <div>
        <div class="field-label" data-i18n="graph.queryType">查询类型</div><output id="graph-current-mode"></output>
        <div class="tab-row" id="graph-tab-row">
          <button class="tab active" onclick="setGraphMode('callers',this)"><svg class="icon" aria-hidden="true"><use href="/vendor/lucide/icons.svg#arrow-down-left"/></svg><span data-i18n="graph.callers">调用方</span></button>
          <button class="tab" onclick="setGraphMode('callees',this)"><svg class="icon" aria-hidden="true"><use href="/vendor/lucide/icons.svg#arrow-up-right"/></svg><span data-i18n="graph.callees">被调用</span></button>
          <button class="tab" onclick="setGraphMode('impact',this)"><svg class="icon" aria-hidden="true"><use href="/vendor/lucide/icons.svg#scan"/></svg><span data-i18n="graph.impact">影响面</span></button>
          <details id="graph-more-queries"><summary data-i18n="graph.moreQueries">更多查询</summary>
            <div class="graph-more-buttons">
          <button class="tab" onclick="setGraphMode('subtypes',this)"><svg class="icon" aria-hidden="true"><use href="/vendor/lucide/icons.svg#git-fork"/></svg><span data-i18n="graph.subtypes">子类型</span></button>
          <button class="tab" onclick="setGraphMode('entrypoints',this)"><svg class="icon" aria-hidden="true"><use href="/vendor/lucide/icons.svg#log-in"/></svg><span data-i18n="graph.entrypoints">入口点</span></button>
          <button class="tab" onclick="setGraphMode('flow',this)"><svg class="icon" aria-hidden="true"><use href="/vendor/lucide/icons.svg#workflow"/></svg><span data-i18n="graph.flow">流分析</span></button>
          <button class="tab" onclick="setGraphMode('deadcode',this)"><svg class="icon" aria-hidden="true"><use href="/vendor/lucide/icons.svg#circle-off"/></svg><span data-i18n="graph.deadcode">疑似死代码</span></button>
          <button class="tab" onclick="setGraphMode('testgap',this)"><svg class="icon" aria-hidden="true"><use href="/vendor/lucide/icons.svg#flask-conical"/></svg><span data-i18n="graph.testgap">测试空白</span></button>
            </div>
          </details>
        </div>
      </div>

      <div id="depth-wrap">
        <label class="field-label" for="graph-depth"><span data-i18n="graph.depth">深度</span> <span id="depth-val">2</span></label>
        <input type="range" id="graph-depth" min="1" max="5" value="2"
          oninput="document.getElementById('depth-val').textContent=this.value">
      </div>

      <div id="entrypoints-wrap" style="display:none">
        <label class="field-label" for="entrypoints-project" data-i18n="graph.entrypointsProject">项目 ID（可选）</label>
        <input type="text" id="entrypoints-project" placeholder="project-name" autocomplete="off"
          list="projects-datalist"
          data-i18n-ph="ph.projectName" onkeydown="if(event.key==='Enter')doGraphQuery()">
        <label class="field-label" for="entrypoints-lang" data-i18n="graph.entrypointsLang">语言过滤</label>
        <span class="select-control"><select id="entrypoints-lang" onchange="doGraphQuery()">
          <option value="" data-i18n="chip.all">全部</option>
          <option value="java">Java</option>
          <option value="c">C</option>
          <option value="python">Python</option>
        </select></span>
      </div>

      <button id="graph-query-btn" class="btn btn-primary" type="button" onclick="doGraphQuery()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51 15.42 17.49M15.41 6.51 8.59 10.49"/></svg>
        <span id="graph-query-label" data-i18n="graph.queryAction">查询图谱</span>
      </button>

      <div class="divider"></div>

      <div class="field-label" id="graph-legend-label" data-i18n="graph.legend">图例</div>
      <div class="graph-legend">
        <div class="legend-item"><div class="legend-dot legend-mint"></div><span data-i18n="kind.class"></span></div>
        <div class="legend-item"><div class="legend-dot legend-purple"></div><span data-i18n="kind.method"></span></div>
        <div class="legend-item"><div class="legend-dot legend-amber"></div><span data-i18n="kind.function"></span></div>
        <div class="legend-item"><div class="legend-dot legend-cyan"></div><span data-i18n="kind.interface"></span></div>
        <div class="legend-item"><div class="legend-dot legend-red"></div><span data-i18n="kind.root"></span></div>
      </div>
      <p id="graph-related-hint" class="graph-related-hint" data-i18n="graph.relatedHint">查询关联视图 · 连线表示与目标的可达关系</p>

      <div id="node-detail" style="display:none" aria-live="polite">
        <div class="divider"></div>
        <div class="field-label" data-i18n="graph.selectedNode">已选节点</div>
        <div class="node-detail" id="node-detail-content"></div>
        <button id="graph-source-btn" type="button" class="btn btn-ghost" onclick="openSelectedGraphSource()" data-i18n="graph.readSource">阅读源码</button>
        <p id="graph-source-status" role="status"></p>
        <button id="graph-pivot-btn" class="btn btn-ghost" onclick="pivotToNode()">
          <span data-i18n="btn.pivotNode">以此节点为目标查询 →</span>
        </button>
      </div>
    </div>

    <!-- Canvas -->
    <div class="graph-canvas" aria-busy="false">
      <div class="flow-summary" id="flow-summary"></div>
      <div class="flow-view-switch" id="flow-view-switch">
        <button class="flow-view-btn active" data-flow-view="cfg" onclick="switchFlowView('cfg',this)">CFG</button>
        <button class="flow-view-btn" data-flow-view="pdg" onclick="switchFlowView('pdg',this)">PDG</button>
      </div>
      <svg id="graph-svg" role="group" data-i18n-aria-label="graph.canvas"
           aria-label="代码关系图，使用 Tab 选择节点，Enter 查看详情">
        <defs>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <linearGradient id="link-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="var(--graph-edge)" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="var(--graph-edge)" stop-opacity="0.3"/>
          </linearGradient>
        </defs>
      </svg>
      <div id="graph-state" class="graph-state" data-status="ready">
        <span class="graph-state-mark" aria-hidden="true">◎</span>
        <strong id="graph-state-title" data-i18n="graph.readyTitle">探索代码关系</strong>
        <p id="graph-state-message" data-i18n="graph.hint">输入符号名称并查询以可视化图谱</p>
        <button id="graph-retry" class="btn btn-ghost" type="button" onclick="doGraphQuery()"
                data-i18n="graph.retry" hidden>重试查询</button>
      </div>
      <div class="graph-hint" id="graph-hint" role="status" aria-live="polite" data-i18n="graph.hint">输入符号名称并查询以可视化图谱</div>
      <div class="graph-controls">
        <button class="graph-ctrl-btn" type="button" onclick="graphZoomOut()" data-i18n-title="graph.zoomOut"
                data-i18n-aria-label="graph.zoomOut" aria-label="缩小" title="缩小">−</button>
        <output id="graph-zoom-level" class="graph-zoom-level">100%</output>
        <button class="graph-ctrl-btn" type="button" onclick="graphZoomIn()" data-i18n-title="graph.zoomIn"
                data-i18n-aria-label="graph.zoomIn" aria-label="放大" title="放大">+</button>
        <button class="graph-ctrl-btn graph-fit-btn" type="button" onclick="graphReset()"
                data-i18n="graph.fit">适应画布</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
