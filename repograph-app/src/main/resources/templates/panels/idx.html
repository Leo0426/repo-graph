<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="panel" id="panel-index" class="panel"
     :class="{ active: $store.repograph.panel === 'index' }">
  <div class="panel-header index-heading">
    <div><div class="panel-title" data-i18n="index.title">索引项目</div>
      <div class="panel-subtitle" data-i18n="index.subtitle">触发并监控索引管道执行过程</div></div>
    <button type="button" class="btn btn-ghost" onclick="focusIndexExecution()" data-i18n="index.viewExecution">查看执行</button>
  </div>
  <div class="panel-body index-workbench">
    <div class="index-layout">
      <details class="index-configuration" id="index-configuration" open>
        <summary><span data-i18n="index.configuration">索引配置</span><span aria-hidden="true">⌄</span></summary>
        <div class="index-configuration-body">
          <p class="index-helper" data-i18n="index.configurationHint">先选择目录和解析方式，再启动后台索引。</p>
          <label class="index-field"><span data-i18n="index.root">项目根目录</span>
            <input type="text" id="index-root" placeholder="/path/to/project" autocomplete="off" spellcheck="false"
                   data-i18n-ph="ph.root" oninput="onIndexRootChange()" aria-describedby="index-validation"></label>
          <p id="index-validation" class="index-validation" role="alert" hidden></p>
          <fieldset class="index-languages"><legend data-i18n="index.languages">解析语言</legend>
            <div class="checkbox-row">
              <label class="check-item"><input type="checkbox" value="java" checked id="lang-java"> Java</label>
              <label class="check-item"><input type="checkbox" value="c" id="lang-c"> C</label>
              <label class="check-item"><input type="checkbox" value="python" id="lang-py"> Python</label>
            </div>
            <p class="index-helper" data-i18n="index.noLanguagesHint">未选中语言时使用全部支持的语言。</p>
          </fieldset>
          <label class="index-field"><span data-i18n="index.strategy">解析策略</span>
            <select id="index-strategy">
              <option value="auto" data-i18n="strategy.auto">自动（精确 → 启发式降级）</option>
              <option value="precise" data-i18n="strategy.precise">仅精确解析</option>
              <option value="heuristic" data-i18n="strategy.heuristic">仅启发式解析</option>
            </select></label>
          <label class="index-rebuild"><input type="checkbox" id="no-incremental">
            <span><strong data-i18n="index.forceReindex">强制重建索引</strong>
              <small data-i18n="index.skipCache">忽略 MD5 缓存</small></span></label>
          <div class="index-form-actions">
            <button type="button" class="btn btn-primary" onclick="triggerIndex()" id="index-btn"><span data-i18n="btn.startIndex">开始索引</span></button>
            <button type="button" class="btn btn-ghost" onclick="checkIndexStatus()" id="status-btn"><span data-i18n="btn.checkStatus">查询状态</span></button>
          </div>
        </div>
      </details>

      <section class="index-execution" id="index-execution" tabindex="-1" aria-labelledby="index-execution-title">
        <div class="index-state-card" id="index-state-card" data-state="ready">
          <div class="index-state-heading"><h2 id="index-execution-title" data-i18n="index.execution">执行状态</h2>
            <span id="ring-status" class="index-state-badge">准备就绪</span></div>
          <div class="index-root-context"><span data-i18n="index.observedRoot">当前查看目录</span>
            <code id="index-observed-root">—</code></div>
          <p id="index-state-note" class="index-state-note" role="status" aria-live="polite"></p>
          <div id="index-connection-error" class="index-connection-error" role="alert" hidden></div>
          <div id="index-progress" class="index-progress" hidden>
            <div class="index-progress-label"><span id="index-stage-label"></span><strong id="ring-pct">—</strong></div>
            <progress id="index-stage-progress" max="100" data-i18n-aria-label="index.stageProgress" aria-label="当前阶段进度"></progress>
            <div class="index-progress-caption"><span id="index-stage-count"></span><span data-i18n="index.stageHint">各阶段工作量不同，此百分比不代表整体完成度。</span></div>
          </div>
          <button type="button" class="btn btn-ghost" id="index-retry-status" onclick="checkIndexStatus()" hidden data-i18n="index.retryStatus">重试状态查询</button>
          <div id="stat-indexed-at-row" class="index-history" hidden><span data-i18n="index.history">历史记录</span>
            <time id="stat-indexed-at"></time></div>
        </div>
        <div class="index-results" aria-label="Index result">
          <div><strong id="stat-files">—</strong><span data-i18n="stat.files">文件</span></div>
          <div><strong id="stat-parsed">—</strong><span data-i18n="index.parsedFiles">已解析文件</span></div>
          <div><strong id="stat-units">—</strong><span data-i18n="stat.units">单元</span></div>
          <div><strong id="stat-edges">—</strong><span data-i18n="stat.edges">边</span></div>
          <div><strong id="stat-errors">—</strong><span data-i18n="stat.errors">错误</span></div>
          <div><strong id="stat-dur">—</strong><span data-i18n="stat.duration">耗时</span></div>
        </div>
        <details id="index-errors-panel" class="index-errors-panel" hidden>
          <summary><span data-i18n="index.errorDetails">索引错误</span> <span id="index-error-count"></span></summary>
          <ul id="index-errors"></ul>
        </details>
        <details class="index-log-panel" open>
          <summary data-i18n="index.logTitle">执行日志</summary>
          <div class="index-log-toolbar"><p data-i18n="index.logHint">最近100条状态变化；查阅旧日志时保留滚动位置。</p>
            <button type="button" class="btn btn-ghost" onclick="clearIndexLog()" data-i18n="index.clearLog">清空日志</button></div>
          <div class="index-log" id="index-log" tabindex="0" role="log" aria-live="polite" aria-relevant="additions" data-i18n-aria-label="index.logTitle" aria-label="执行日志"></div>
        </details>
      </section>
    </div>
  </div>
</div>
</body>
</html>
