<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="panel" id="panel-sbom" class="panel"
     :class="{ active: $store.repograph.panel === 'sbom' }">
  <div class="panel-header">
    <div class="panel-title" data-i18n="sbom.title">软件物料清单</div>
    <div class="panel-subtitle" data-i18n="sbom.subtitle">CycloneDX 格式 · 直接依赖可视化</div>
  </div>
  <div class="panel-body">
    <section class="card sbom-command-card">
      <form onsubmit="event.preventDefault();loadSbomView()">
        <div class="sbom-project-field"><label for="sbom-view-input" data-i18n="sbom.project.label">项目名称或 ID</label>
          <input type="text" id="sbom-view-input" placeholder="project-name" autocomplete="off" list="projects-datalist"
                 data-i18n-ph="ph.projectName" oninput="invalidateSbomView()" aria-describedby="sbom-project-help"></div>
        <button type="submit" class="btn btn-primary" id="sbom-view-submit" data-i18n="sbom.btn.view">生成并查看</button>
        <button type="button" class="btn btn-ghost" id="sbom-download-btn" onclick="downloadSbomJson()" hidden data-i18n="tools.sbom.download">下载 JSON</button>
      </form>
      <p id="sbom-project-help" data-i18n="sbom.initial">选择已索引项目，查看声明的直接依赖。</p>
    </section>
    <div id="sbom-view-content" aria-busy="false"></div>
  </div>
</div>
</body>
</html>
