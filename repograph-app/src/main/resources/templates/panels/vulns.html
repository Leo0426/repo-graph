<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="panel" id="panel-vulns" class="panel"
     :class="{ active: $store.repograph.panel === 'vulns' }">
  <div class="panel-header vuln-heading">
    <div>
      <div class="panel-title" data-i18n="vulns.title">代码漏洞</div>
      <div class="panel-subtitle" data-i18n="vulns.subtitle">静态规则扫描 · 结果需人工确认</div>
    </div>
    <button type="button" class="btn btn-ghost" onclick="showVulnReport()" id="vuln-report-btn" disabled>
      <span data-i18n="btn.vulnReport">生成报告</span>
    </button>
  </div>
  <div class="panel-body vuln-workbench">
    <section class="vuln-controls" data-i18n-aria-label="vuln.filters" aria-label="筛选发现">
      <div class="vuln-project-row">
        <label class="vuln-project-field"><span data-i18n="vuln.project">扫描项目</span>
          <select id="vuln-project-select" onchange="onVulnProjectChange()">
            <option value="" data-i18n="ph.selectProject">— 选择项目 —</option>
          </select>
        </label>
        <div class="vuln-scan-actions">
          <button type="button" class="btn btn-primary" onclick="triggerVulnScan()" id="vuln-scan-btn" disabled
                  data-i18n="btn.scanVulns">代码扫描</button>
          <button type="button" class="btn btn-ghost" onclick="triggerTaintScan()" id="vuln-taint-btn" disabled
                  data-i18n="btn.scanTaint">污点追踪</button>
          <button type="button" class="btn btn-ghost" onclick="triggerDepsScan()" id="vuln-deps-btn" disabled
                  data-i18n="btn.scanDeps">依赖扫描</button>
        </div>
      </div>
      <div class="vuln-filter-row">
        <label><span data-i18n="vuln.severity">严重程度</span>
          <select id="vuln-filter-severity" onchange="loadVulns()">
            <option value="" data-i18n="vuln.allSeverity">全部严重程度</option>
            <option value="CRITICAL" data-i18n="vuln.critical">CRITICAL</option>
            <option value="HIGH" data-i18n="vuln.high">HIGH</option>
            <option value="MEDIUM" data-i18n="vuln.medium">MEDIUM</option>
            <option value="LOW" data-i18n="vuln.low">LOW</option>
          </select>
        </label>
        <label><span data-i18n="vuln.status">处理状态</span>
          <select id="vuln-filter-status" onchange="loadVulns()">
            <option value="" data-i18n="vuln.allStatus">全部状态</option>
            <option value="SUSPECTED" data-i18n="vuln.suspected">疑似</option>
            <option value="CONFIRMED" data-i18n="vuln.confirmed">已确认</option>
            <option value="FIXED" data-i18n="vuln.fixed">已修复</option>
            <option value="DISMISSED" data-i18n="vuln.dismissed">已忽略</option>
          </select>
        </label>
        <button type="button" class="btn btn-ghost" id="vuln-refresh-btn" onclick="loadVulns()" disabled
                data-i18n="vuln.refresh">刷新结果</button>
      </div>
      <div id="vuln-scan-status" class="vuln-scan-status" role="status" aria-live="polite"></div>
    </section>

    <section class="vuln-summary" aria-live="polite" aria-atomic="true">
      <div class="vuln-result-total"><strong id="vuln-result-count">—</strong>
        <span data-i18n="vuln.currentResults">当前结果</span></div>
      <div><div id="vuln-result-breakdown" class="vuln-result-breakdown"></div>
        <p data-i18n="vuln.scopeHint">计数仅对应当前项目与筛选条件，发现仍需人工核实。</p></div>
    </section>
    <div id="vuln-list" aria-busy="false">
      <div class="vuln-empty"><strong data-i18n="vuln.noProject">先选择一个项目</strong>
        <p data-i18n="vuln.emptyHint">选择项目查看已有发现，也可按需运行代码、污点或依赖扫描。</p></div>
    </div>

    <dialog id="vuln-report-modal" class="vuln-report-dialog" aria-labelledby="vuln-report-title"
            onclose="onVulnReportClosed()" onclick="if(event.target===this)closeVulnReport()">
      <div class="vuln-report-card">
        <div class="vuln-report-heading">
          <h2 id="vuln-report-title" data-i18n="vuln.reportTitle">漏洞报告</h2>
          <button type="button" class="btn btn-ghost" onclick="closeVulnReport()" autofocus
                  data-i18n="btn.close">关闭</button>
        </div>
        <div id="vuln-report-state" role="status"></div>
        <textarea id="vuln-report-text" readonly data-i18n-aria-label="vuln.reportContent"
                  aria-label="漏洞报告 Markdown"></textarea>
        <div class="vuln-report-actions">
          <button type="button" class="btn btn-ghost" id="vuln-report-retry" onclick="showVulnReport()" hidden
                  data-i18n="vuln.retry">重试</button>
          <button type="button" class="btn btn-primary" id="vuln-report-copy" onclick="copyVulnReport()" disabled
                  data-i18n="btn.copy">复制</button>
        </div>
      </div>
    </dialog>
  </div>
</div>
</body>
</html>
