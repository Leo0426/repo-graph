<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="header" class="app-header">
  <button class="nav-toggle" id="nav-toggle" type="button" aria-controls="main-navigation"
          :aria-expanded="$store.repograph.navOpen" @click="$store.repograph.toggleNavigation()"
          data-i18n-aria-label="shell.menu" aria-label="打开导航">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>
  <div class="logo">
    <img th:src="@{/img/logo.png}" src="/img/logo.png" alt="RepoGraph" class="logo-img"/>
    RepoGraph
  </div>
  <div class="header-sep"></div>
  <button class="header-search" type="button" onclick="focusGlobalSearch()"
          data-i18n-aria-label="shell.search" aria-label="搜索代码">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>
    </svg>
    <span data-i18n="shell.search">搜索代码</span><kbd>⌘ K</kbd>
  </button>
  <div class="project-context">
    <span class="project-context-label" data-i18n="header.project">Project</span>
    <select id="global-project" onchange="setGlobalProject(this.value)" aria-label="Active project"
            data-i18n-aria-label="header.projectScope">
      <option value="" data-i18n="header.allProjects">All projects</option>
    </select>
  </div>
  <div class="health-badges">
    <div class="badge" id="hb-qdrant" data-health="checking">
      <div class="badge-dot checking" id="hd-qdrant" aria-hidden="true"></div>
      <span>Qdrant</span>
      <span class="badge-state" data-i18n="shell.service.checking">检查中</span>
    </div>
    <div class="badge" id="hb-ollama" data-health="checking">
      <div class="badge-dot checking" id="hd-ollama" aria-hidden="true"></div>
      <span>Ollama</span>
      <span class="badge-state" data-i18n="shell.service.checking">检查中</span>
    </div>
    <div class="badge" id="hb-neo4j" data-health="checking">
      <div class="badge-dot checking" id="hd-neo4j" aria-hidden="true"></div>
      <span>Neo4j</span>
      <span class="badge-state" data-i18n="shell.service.checking">检查中</span>
    </div>
  </div>
  <div class="lang-toggle">
    <button class="lang-btn" id="lang-zh"
            :class="{ active: $store.repograph.lang === 'zh' }"
            @click="$store.repograph.setLang('zh')">中文</button>
    <button class="lang-btn" id="lang-en"
            :class="{ active: $store.repograph.lang === 'en' }"
            @click="$store.repograph.setLang('en')">EN</button>
  </div>
</header>
</html>
