repograph:
  qdrant:
    host: localhost
    port: 16334
    collection: code_units
    vector-size: 3584
  ollama:
    base-url: http://192.168.4.113:11434
    model: manutic/nomic-embed-code
    timeout-seconds: 300
  neo4j:
    uri: bolt://localhost:7687
    user: neo4j
    password: neo4jneo4j
  index:
    db-path: ${user.home}/.repograph/index.db
    batch-size:
      embed: 8
      upsert: 256
      parallelism: 4   # concurrent embed batches; pool size = 2 × parallelism
    default-strategy: AUTO
  assets:
    root-dir: ${user.home}/.repograph/assets
    max-upload-mb: 200
    max-extracted-mb: 1024
    max-entries: 50000
    max-single-file-mb: 50
    max-depth: 32
  scanners:
    work-dir: ${user.home}/.repograph/scans
    default-timeout-seconds: 900
    max-output-mb: 100
    max-findings: 5000
    semgrep-command: semgrep
    semgrep-config: auto
    codeql-command: codeql
    codeql-query-suite: security-extended
  advisory:
    enabled: false             # 默认关闭；明确提供方和源码出域策略后再启用
    max-input-chars: 12000
    max-output-chars: 4000
    max-estimated-cost-usd: 0.05
    timeout-millis: 15000
    max-retries: 1
    redact: true
  taint:
    precise:                 # 方案 A:WALA IFDS 引擎独立进程(需带 jmods 的 JDK)
      enabled: false         # 配好 java-home 与 engine-lib-dir 后置 true
      java-home: ""          # 带 jmods 的 JDK 主目录,如 ~/.sdkman/candidates/java/21.0.9-tem
      engine-lib-dir: ""     # 引擎 installDist 产物 lib 目录
      exclusions: ""         # 可选 WALA 排除文件;空则用引擎打包默认
      timeout-seconds: 600
  github:
    token: ""                    # Personal Access Token 或 GitHub App token；留空则发评论时报错
    api-base-url: https://api.github.com
    timeout-seconds: 15

server:
  port: 8080
