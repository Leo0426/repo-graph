[versions]
javaparser        = "3.26.1"
sootup            = "1.3.0"
sqlite-jdbc       = "3.46.1.3"
treesitter        = "0.25.3"
treesitter-c      = "0.23.2"
treesitter-python = "0.23.4"
qdrant            = "1.9.1"
neo4j-driver      = "5.21.0"
neo4j-harness     = "5.21.0"
spring-boot       = "3.4.5"
spring-dep-mgmt   = "1.1.7"
picocli           = "4.7.6"
jackson           = "2.17.2"
protobuf          = "3.24.0"
commons-compress  = "1.28.0"

[libraries]
javaparser        = { module = "com.github.javaparser:javaparser-symbol-solver-core", version.ref = "javaparser" }
treesitter        = { module = "io.github.bonede:tree-sitter",                        version.ref = "treesitter" }
treesitter-c      = { module = "io.github.bonede:tree-sitter-c",                      version.ref = "treesitter-c" }
treesitter-python = { module = "io.github.bonede:tree-sitter-python",                 version.ref = "treesitter-python" }
qdrant            = { module = "io.qdrant:client",                                    version.ref = "qdrant" }
neo4j-driver      = { module = "org.neo4j.driver:neo4j-java-driver",                  version.ref = "neo4j-driver" }
neo4j-harness     = { module = "org.neo4j.test:neo4j-harness",                        version.ref = "neo4j-harness" }
jackson-databind  = { module = "com.fasterxml.jackson.core:jackson-databind",         version.ref = "jackson" }
picocli           = { module = "info.picocli:picocli",                                version.ref = "picocli" }
picocli-spring    = { module = "info.picocli:picocli-spring-boot-starter",            version.ref = "picocli" }
sqlite-jdbc       = { module = "org.xerial:sqlite-jdbc",                              version.ref = "sqlite-jdbc" }
protobuf-java     = { module = "com.google.protobuf:protobuf-java",                   version.ref = "protobuf" }
sootup-core          = { module = "org.soot-oss:sootup.core",          version.ref = "sootup" }
sootup-java-core     = { module = "org.soot-oss:sootup.java.core",     version.ref = "sootup" }
sootup-java-bytecode = { module = "org.soot-oss:sootup.java.bytecode", version.ref = "sootup" }
commons-compress     = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }

[plugins]
spring-boot      = { id = "org.springframework.boot",          version.ref = "spring-boot" }
spring-dep-mgmt  = { id = "io.spring.dependency-management",   version.ref = "spring-dep-mgmt" }
